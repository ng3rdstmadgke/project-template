# prefixキーをtmuxデフォルトのC-bに設定する
set -g prefix C-b

# C-bを2回押してtmux内のプログラムにprefixキーを送る
bind C-b send-prefix

# キーストロークのディレイを減らす(TUIアプリのキー応答改善のため0にする)
set -sg escape-time 0

# スクロールバック履歴を拡張する(AIエージェントの大量出力を遡れるようにする)
set -g history-limit 100000

# フォーカスイベントを有効にする(TUIアプリがフォーカス変化を検知できるようにする)
set -g focus-events on

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 他ペインで出力があったら通知する
setw -g monitor-activity on
set -g visual-activity on

# 他のペインで一定時間出力がなければ通知する（Agentの処理完了に気付くための簡易的な目安として利用）
# bind S で 通知/非通知を切り替え
bind S if -F "#{monitor-silence}" \
  "setw monitor-silence 0 ; display 'monitor-silence OFF'" \
  "setw monitor-silence 15 ; display 'monitor-silence ON (15s)'"
set -g visual-silence on

# ペインの識別をしやすくする(手動で付けたタイトルも表示する)
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} #{?#{!=:#{pane_title},#{host_short}},[#{pane_title}] ,}"
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=green

# マウス操作を有効にする
setw -g mouse on

# 256色端末を使用する(TUIの表示崩れを防ぐためtmux用のterminfoを使う)
set -g default-terminal "tmux-256color"

# 外側の端末がtruecolorに対応している場合に24bit色を通す
set -ga terminal-overrides ",*256col*:Tc"

# OSC 52によるクリップボード連携や画像表示のエスケープを端末へ透過させる
# (tmux 3.3未満にはこのオプションが無いため -q でエラーを抑制する)
set -gq allow-passthrough on

# ステータスバーの色を設定する
set -g status-fg white
set -g status-bg black

# ステータスバーを設定する
## 左パネルを設定する
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
## 右パネルを設定する
set -g status-right-length 60
set -g status-right '#{?pane_synchronized,#[fg=black#,bg=yellow] SYNC #[default] ,}#[fg=cyan] #(TZ="Asia/Tokyo" date +"%Y/%m/%d %H:%M %a")'
## ウィンドウリストにアクティビティ等のフラグ(#F)を表示する
setw -g window-status-format "#I:#W#F"
setw -g window-status-current-format "#[fg=black,bg=green]#I:#W#F#[default]"
setw -g window-status-activity-style "fg=yellow,bold"
setw -g window-status-bell-style "fg=red,bold"
## リフレッシュの間隔を設定する(デフォルト 15秒)
set -g status-interval 60
## ウィンドウリストの位置を中心寄せにする
set -g status-justify centre

# コピーモードを設定する
## viのキーバインドを使用する
setw -g mode-keys vi
## tmuxのコピー結果を端末のクリップボードへ連携する
set-option -s set-clipboard on

# ペインの移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# windowの移動
bind -r p select-window -t :-
bind -r n select-window -t :+

# ペインのリサイズ (-r オプションで連続してキー入力できるようになる)
bind -r C-k resize-pane -U 3
bind -r C-j resize-pane -D 3
bind -r C-h resize-pane -L 3
bind -r C-l resize-pane -R 3


# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# | でペインを縦に分割する(作業中のディレクトリを引き継ぐ)
bind | split-window -h -c "#{pane_current_path}"

# - でペインを横に分割する(作業中のディレクトリを引き継ぐ)
bind - split-window -v -c "#{pane_current_path}"

# 新規ウィンドウも同じリポジトリで作業を続けられるようカレントディレクトリで開く
bind c new-window -c "#{pane_current_path}"

# = でペインをタイル配置に整える(エージェントを並べて一覧しやすくする)
bind = select-layout tiled

# 全ペインへの同時入力をトグルする(複数エージェントに同じ指示を一括送信する)
bind s setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,ON,OFF}"

# ペインに手動で名前を付ける(どのエージェントの担当かを判別しやすくする)
bind T command-prompt -p "pane title:" "select-pane -T '%%'"